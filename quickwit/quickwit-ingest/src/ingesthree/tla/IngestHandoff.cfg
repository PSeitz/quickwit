SPECIFICATION Spec

CONSTANTS
    Attempts = {attempt1, attempt2}
    Parts = {split1, split2}

INVARIANTS
    TypeOK
    AckAfterFlush
    AcknowledgedRecoverable
    HandoffBeforeLocalDeletion
    InputAvailable
    AtMostOnePublication
