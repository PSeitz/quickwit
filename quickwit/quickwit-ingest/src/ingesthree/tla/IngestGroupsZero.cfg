\* Exhaustive empty-output completion, with the same overlapping groups/retries.
SPECIFICATION Spec
CONSTANTS
    Files = {"A", "B", "C"}
    Attempts = {"ab", "bc", "retry"}
    Parts = {}
    AttemptGroups <- OverlapGroups
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AtMostOnePublication
    GroupAtomicity
    CompletionCorrespondence
    PublishedObjectsExist
    CleanupAuthority
    AssignmentChecks
PROPERTIES
    AssignmentRequiresEligibility
    WinnersStable
    GroupsStable
